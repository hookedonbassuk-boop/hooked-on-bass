server {
    listen 80;
    server_name hookedonbass.co.uk www.hookedonbass.co.uk;

    root /var/www/hooked-on-bass;
    index index.html;

    # Never expose Git metadata or hidden files.
    # Keep .well-known available for certificate/domain validation.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    # Deployment files belong on the server, not on the public website.
    location ^~ /deployment/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}